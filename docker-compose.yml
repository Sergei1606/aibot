version: '3.8'

services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data      # ← локальная папка
      - ./logs:/app/logs      # ← локальная папка
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://aibot:aibot@db:5432/aibotdb
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.tasks worker -l info
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://aibot:aibot@db:5432/aibotdb
    depends_on:
      redis:
        condition: service_started
      web:
        condition: service_started
      db:
        condition: service_healthy

  beat:
    build: .
    command: celery -A app.tasks beat -l info
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://aibot:aibot@db:5432/aibotdb
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=aibot
      - POSTGRES_PASSWORD=aibot
      - POSTGRES_DB=aibotdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibot -d aibotdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: