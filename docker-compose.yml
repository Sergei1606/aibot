version: '3.8'

services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data      # ← локальная папка
      - ./logs:/app/logs      # ← локальная папка
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/aibot.db
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A app.tasks worker -l info
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/aibot.db
    depends_on:
      - redis
      - web

  beat:
    build: .
    command: celery -A app.tasks beat -l info
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/aibot.db
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"