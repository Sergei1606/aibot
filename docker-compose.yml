version: '3.8'

services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - aibot_data:/app/data
      - aibot_logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A app.tasks worker -l info
    volumes:
      - aibot_data:/app/data
      - aibot_logs:/app/logs
    env_file:
      - .env
    depends_on:
      - redis
      - web

  beat:
    build: .
    command: celery -A app.tasks beat -l info
    volumes:
      - aibot_data:/app/data
      - aibot_logs:/app/logs
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  aibot_data:
  aibot_logs:
