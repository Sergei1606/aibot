<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Bot - Панель управления</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 85% 15%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 15% 85%, rgba(239, 68, 68, 0.1), transparent 25%);
            background-attachment: fixed;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger-hover);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        h2 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .form-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        input,
        select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
            flex: 1;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td {
            font-size: 0.95rem;
        }

        .badge {
            background: rgba(59, 130, 246, 0.2);
            color: var(--primary);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-tg {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .keyword-tag {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 16px;
            margin: 0.3rem;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .keyword-tag:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .keyword-tag span {
            margin-right: 0.5rem;
        }

        .keyword-tag button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .keyword-tag button:hover {
            color: var(--danger);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Управление контентом ⚙️</h1>
            <a href="/" class="btn">← Назад в дашборд</a>
        </header>

        <!-- Источники -->
        <div class="card" style="animation-delay: 0.1s">
            <h2>Источники (Sources)</h2>
            <form id="source-form" class="form-group" onsubmit="addSource(event)">
                <select id="src-type" required style="flex: 0.3;">
                    <option value="site">Сайт (RSS)</option>
                    <option value="tg">Telegram</option>
                </select>
                <input type="text" id="src-name" placeholder="Название (например, Хабр)" required>
                <input type="text" id="src-url" placeholder="URL или @username" required>
                <button type="submit" class="btn">Добавить</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Тип</th>
                        <th>Название</th>
                        <th>Ссылка / Username</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="sources-list">
                    <!-- Заполняется через JS -->
                </tbody>
            </table>
        </div>

        <!-- Ключевые слова -->
        <div class="card" style="animation-delay: 0.2s">
            <h2>Ключевые слова (Keywords)</h2>
            <form id="keyword-form" class="form-group" onsubmit="addKeyword(event)">
                <input type="text" id="kw-word" placeholder="Введите новое слово..." required>
                <button type="submit" class="btn">Добавить</button>
            </form>

            <div id="keywords-list" style="display: flex; flex-wrap: wrap;">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </div>

    <script>
        // Загрузка источников
        async function loadSources() {
            const res = await fetch('/api/sources/');
            const sources = await res.json();
            const tbody = document.getElementById('sources-list');
            tbody.innerHTML = '';
            sources.forEach(src => {
                const tr = document.createElement('tr');
                const link = src.type === 'tg' ? src.tg_username : src.url;
                const badgeClass = src.type === 'tg' ? 'badge badge-tg' : 'badge';
                tr.innerHTML = `
                    <td><span class="${badgeClass}">${src.type.toUpperCase()}</span></td>
                    <td>${src.name}</td>
                    <td>${link || '-'}</td>
                    <td><button class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="deleteSource(${src.id})">Удалить</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Загрузка слов
        async function loadKeywords() {
            const res = await fetch('/api/keywords/');
            const keywords = await res.json();
            const list = document.getElementById('keywords-list');
            list.innerHTML = '';
            keywords.forEach(kw => {
                const div = document.createElement('div');
                div.className = 'keyword-tag';
                div.innerHTML = `<span>${kw.word}</span> <button onclick="deleteKeyword(${kw.id})">×</button>`;
                list.appendChild(div);
            });
        }

        // Добавление источника
        async function addSource(e) {
            e.preventDefault();
            const type = document.getElementById('src-type').value;
            const name = document.getElementById('src-name').value;
            const link = document.getElementById('src-url').value;

            const payload = { type, name };
            if (type === 'tg') {
                payload.tg_username = link;
                payload.url = null;
            } else {
                payload.url = link;
                payload.tg_username = null;
            }

            try {
                await fetch('/api/sources/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('source-form').reset();
                loadSources();
            } catch (err) {
                alert('Ошибка при добавлении источника');
            }
        }

        // Добавление слова
        async function addKeyword(e) {
            e.preventDefault();
            const word = document.getElementById('kw-word').value;
            try {
                await fetch('/api/keywords/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word })
                });
                document.getElementById('keyword-form').reset();
                loadKeywords();
            } catch (err) {
                alert('Ошибка при добавлении слова');
            }
        }

        // Удаление источника
        async function deleteSource(id) {
            if (confirm('Вы уверены, что хотите удалить этот источник?')) {
                await fetch('/api/sources/' + id, { method: 'DELETE' });
                loadSources();
            }
        }

        // Удаление слова
        async function deleteKeyword(id) {
            if (confirm('Удалить ключевое слово?')) {
                await fetch('/api/keywords/' + id, { method: 'DELETE' });
                loadKeywords();
            }
        }

        // Инициализация при загрузке страницы
        loadSources();
        loadKeywords();
    </script>
</body>

</html>
